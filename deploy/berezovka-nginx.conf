#
# Важно: service worker получает область только внутри своей папки, поэтому
# для подпапки регистрация идёт как ./sw.js — путь относительный, менять ничего не нужно.
#
# Проверка и применение:
#   sudo nginx -t && sudo systemctl reload nginx

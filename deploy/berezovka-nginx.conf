# /etc/nginx/sites-available/berezovka
#
# ВАРИАНТ A (активен ниже): страница на своём порту, адрес http://IP:8423/
# Ничего ни у кого не отбирает, конфликтов с существующими сайтами нет.
#
# ВАРИАНТ B (закомментирован в конце): подпапка уже существующего сайта,
# адрес вида http://IP/bus/ — тогда этот блок надо вставить внутрь
# своего server { ... } и файлы положить туда же.

server {
    listen 8423;
    listen [::]:8423;
    server_name _;

    root /var/www/berezovka;
    index index.html;

    # страница одна, поэтому любой путь отдаёт её же
    location / {
        try_files $uri $uri/ /index.html;
    }

    # расписание обновляется отдельным файлом — его не кэшируем
    location = /data.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # service worker и манифест тоже должны быть свежими, иначе PWA
    # подхватит обновление страницы с задержкой
    location = /sw.js {
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # иконки не меняются — пусть лежат в кэше браузера
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html application/javascript text/css application/manifest+json;

    access_log /var/log/nginx/berezovka.access.log;
    error_log  /var/log/nginx/berezovka.error.log;
}

# ─── ВАРИАНТ B: подпапка существующего сайта ────────────────────────────────
#
#   location /bus/ {
#       alias /var/www/berezovka/;
#       index index.html;
#       try_files $uri $uri/ /bus/index.html;
#   }
#   location = /bus/data.js {
#       alias /var/www/berezovka/data.js;
#       add_header Cache-Control "no-cache, must-revalidate";
#   }

name: Обновление расписания

# Запуск:
#   • каждый день в 03:00 UTC = 06:00 по Минску (UTC+3);
#   • вручную: вкладка Actions → «Обновление расписания» → Run workflow.
# Если нужно чаще — добавьте ещё строки в schedule, например "0 12 * * *".

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write          # чтобы бот мог закоммитить обновлённый data.js

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Скачать табло с ticketbus.by
        run: node _tools/scrape_ticketbus.js

      - name: Собрать data.js
        run: node _tools/build_live_data.js

      - name: Проверить данные
        run: node _tools/check_data.js

      # Метка времени в data.js меняется при каждом сборе, поэтому сравниваем
      # данные без неё: коммит делаем только при реальных изменениях расписания.
      - name: Изменилось ли расписание
        id: diff
        run: |
          strip_ts() { sed -E 's/"updated":"[^"]*"/"updated":""/'; }
          git show HEAD:data.js | strip_ts > /tmp/old.js
          strip_ts < data.js > /tmp/new.js
          if cmp -s /tmp/old.js /tmp/new.js; then
            echo "расписание не изменилось"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "расписание изменилось"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Закоммитить data.js
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "расписание: $(date -u '+%d.%m.%Y %H:%M UTC')"
          git push

      # Если сборка упала (источник изменил формат, сайт недоступен) — сохраняем
      # скачанное, чтобы можно было посмотреть, что пришло в ответ.
      - name: Сырые данные при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ github.run_id }}
          path: _tools/live/
          retention-days: 7
          if-no-files-found: ignore
